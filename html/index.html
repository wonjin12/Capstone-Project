<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카카오맵 + 스마트 챗봇 추천</title>
  <style>
    body { margin: 0; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
    #topbar { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #ddd; display: flex; gap: 16px; align-items: center; }
    #selected-gu { font-weight: bold; color: #004c80; }
    #map { width: 100%; height: calc(100vh - 58px); }

    /* --- 챗봇 UI 스타일 --- */
    #chatbot-container {
      position: absolute; bottom: 20px; right: 20px; z-index: 100;
      width: 700px;
      height: 750px;
      background: white; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3); border: 1px solid #ddd;
      display: none; /* 처음엔 숨김*/
      flex-direction: column; overflow: hidden;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #chatbot-header { 
      background: #004c80; color: white; padding: 20px; 
      font-weight: bold; font-size: 20px; 
      display: flex; justify-content: space-between; align-items: center; 
    }
    #close-chatbot { cursor: pointer; font-size: 28px; }

    #chatbot-messages { 
      flex: 1;
      overflow-y: auto; padding: 30px; 
      background: #f9f9f9; font-size: 16px; 
      display: flex; flex-direction: column; gap: 20px; 
    }
    .message { padding: 15px 20px; border-radius: 20px; max-width: 80%; line-height: 1.6; word-break: break-all; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .bot { background: #eeeeee; align-self: flex-start; color: #333; border-bottom-left-radius: 2px; }
    .user { background: #004c80; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    
    #chatbot-input-area { border-top: 1px solid #eee; padding: 20px; display: flex; gap: 10px; background: white; }
    #chatbot-input { 
      flex: 1; border: 2px solid #ddd; border-radius: 10px; 
      padding: 15px; outline: none; font-size: 16px; 
    }
    #chatbot-input:focus { border-color: #004c80; }
    #chatbot-send { 
      background: #004c80; color: white; border: none; 
      padding: 0 30px; border-radius: 10px; cursor: pointer; 
      font-size: 18px; font-weight: bold;
    }
    
    .recommend-item { 
      background: white; border: 2px solid #004c80; padding: 12px 20px; 
      border-radius: 25px; cursor: pointer; font-size: 15px; 
      margin-top: 10px; transition: 0.2s; font-weight: bold;
      color: #004c80; display: inline-block;
    }
    .recommend-item:hover { background: #004c80; color: white; }

    .legend { position: absolute; bottom: 20px; left: 20px; z-index: 10; background: white; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .blue { background: #1e90ff; } .red { background: #ff4d4f; } .sky { background: #66ccff; }
  </style>
</head>
<body>

<div id="topbar">
  <span id="selected-gu">선택된 구: 없음</span>
  <label><input type="checkbox" id="toggleSubway" checked> 지하철 표시</label>
  <label><input type="checkbox" id="toggleShop"> 상권 표시</label>
  <button id="resetBtn">전체 보기</button>
</div>

<div id="map"></div>

<div id="chatbot-container">
  <div id="chatbot-header">🏠 <span id="chatbot-title">동네 추천 도우미</span> <span id="close-chatbot">×</span></div>
  <div id="chatbot-messages">
    <div class="message bot">안녕하세요! 도현 님.<br>지도의 '구'를 클릭하신 뒤, 원하시는 조건을 입력해 주세요!</div>
  </div>
  <div id="chatbot-input-area">
    <input type="text" id="chatbot-input" placeholder="예: 지하철역 가깝고 카페 많은 곳 추천해줘">
    <button id="chatbot-send">전송</button>
  </div>
</div>

<div class="legend">
  <div><span class="dot sky"></span>구 경계</div>
  <div><span class="dot blue"></span>지하철</div>
  <div><span class="dot red"></span>상권</div>
</div>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8a64f8dd5fa4f9d44644222cdea30be6"></script>

<script>
  // 1. 지도 설정
  const container = document.getElementById('map');
  const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 8 };
  const map = new kakao.maps.Map(container, options);

  // 2. 변수 및 요소 초기화
  const selectedGuEl = document.getElementById('selected-gu');
  const toggleSubwayEl = document.getElementById('toggleSubway');
  const toggleShopEl = document.getElementById('toggleShop');
  const resetBtn = document.getElementById('resetBtn');
  const chatbotContainer = document.getElementById('chatbot-container');
  const closeChatbot = document.getElementById('close-chatbot');
  const chatbotTitle = document.getElementById('chatbot-title');

  let selectedGu = null;
  let subwayData = [], shopData = [], cachedGeoJson = null;
  let subwayMarkers = [], shopMarkers = [], guPolygons = [];

  function openChatbot(guName) {
    chatbotContainer.style.display = 'flex';
    chatbotTitle.innerText = `${guName} 분석 챗봇`;
    addMessage(`<strong>${guName}</strong> 지역을 분석할 준비가 되었습니다. 어떤 조건이 중요하신가요?`, 'bot');
  }

  closeChatbot.onclick = () => { chatbotContainer.style.display = 'none'; };

  function clearMarkers(markers) { markers.forEach(m => m.setMap(null)); }

  function createInfoWindowContent(title, detailLines = []) {
    return `<div style="padding:8px 10px; font-size:12px; line-height:1.5;"><strong>${title}</strong>${detailLines.map(l => `<div>${l}</div>`).join('')}</div>`;
  }

  function addInfoWindow(marker, content) {
    const iw = new kakao.maps.InfoWindow({ content });
    kakao.maps.event.addListener(marker, 'mouseover', () => iw.open(map, marker));
    kakao.maps.event.addListener(marker, 'mouseout', () => iw.close());
  }

  function makeMarkerImage(color) {
    let src = color === "red" ? "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png" : "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png";
    return new kakao.maps.MarkerImage(src, new kakao.maps.Size(24, 35));
  }

  async function loadJson(path) {
    const res = await fetch(path);
    return res.json();
  }

  function drawSinglePolygon(path, guName, isSelected = false) {
    const polygon = new kakao.maps.Polygon({
      map: map, path: path, strokeWeight: isSelected ? 4 : 2,
      strokeColor: isSelected ? '#ff6600' : '#004c80', strokeOpacity: 0.9,
      fillColor: isSelected ? '#ffcc80' : '#0099ff', fillOpacity: isSelected ? 0.45 : 0.22
    });

    kakao.maps.event.addListener(polygon, 'click', function() {
      selectedGu = guName;
      selectedGuEl.textContent = `선택된 구: ${selectedGu}`;
      renderAll();
      openChatbot(guName); 
    });

    guPolygons.push(polygon);
  }

  function drawGeoJson(geojson) {
    guPolygons.forEach(p => p.setMap(null)); guPolygons = [];
    geojson.features.forEach(f => {
      const guName = f.properties.name;
      if (f.geometry.type === "Polygon") {
        drawSinglePolygon(f.geometry.coordinates[0].map(c => new kakao.maps.LatLng(c[1], c[0])), guName, selectedGu === guName);
      } else {
        f.geometry.coordinates.forEach(pc => drawSinglePolygon(pc[0].map(c => new kakao.maps.LatLng(c[1], c[0])), guName, selectedGu === guName));
      }
    });
  }

  function renderSubwayMarkers() {
    clearMarkers(subwayMarkers); subwayMarkers = [];
    if (!toggleSubwayEl.checked) return;
    const data = selectedGu ? subwayData.filter(d => d.gu === selectedGu) : subwayData;
    data.forEach(d => {
      const m = new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(d.lat, d.lng), image: makeMarkerImage("blue") });
      addInfoWindow(m, createInfoWindowContent(d.name, [`노선: ${d.line}`]));
      subwayMarkers.push(m);
    });
  }

  function renderShopMarkers() {
    clearMarkers(shopMarkers); shopMarkers = [];
    if (!toggleShopEl.checked) return;
    const data = selectedGu ? shopData.filter(d => d.gu === selectedGu) : shopData;
    data.forEach(d => {
      const m = new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(d.lat, d.lng), image: makeMarkerImage("red") });
      addInfoWindow(m, createInfoWindowContent(d.name, [`업종: ${d.category}`]));
      shopMarkers.push(m);
    });
  }

  function renderAll() {
    if (cachedGeoJson) drawGeoJson(cachedGeoJson);
    renderSubwayMarkers();
    renderShopMarkers();
  }

  toggleSubwayEl.onchange = renderAll;
  toggleShopEl.onchange = renderAll;
  resetBtn.onclick = () => { selectedGu = null; selectedGuEl.textContent = '선택된 구: 없음'; chatbotContainer.style.display = 'none'; renderAll(); };

  // --- 챗봇 로직 ---
  const chatInput = document.getElementById('chatbot-input');
  const chatSend = document.getElementById('chatbot-send');
  const chatMessages = document.getElementById('chatbot-messages');

  function addMessage(text, type) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${type}`;
    msgDiv.innerHTML = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  chatSend.onclick = () => {
    const text = chatInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    chatInput.value = '';
    
    // 임시 분석 메시지
    setTimeout(() => { 
      addMessage(`'${text}' 요청에 대해 ${selectedGu}의 인프라 데이터를 분석 중입니다... 잠시만 기다려주세요.`, 'bot'); 
    }, 600);
  };

  // 엔터키 전송 (한글 중복 전송 방지 포함)
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      chatSend.click();
    }
  });

  async function init() {
    try {
      const [geojson, subwayJson, shopJson] = await Promise.all([
        loadJson('./seoul_gu_geo.json'), loadJson('./subway_points.json'), loadJson('./shop_points.json')
      ]);
      cachedGeoJson = geojson; subwayData = subwayJson; shopData = shopJson;
      renderAll();
    } catch (err) { console.error(err); }
  }

  init();
</script>

</body>
</html>
